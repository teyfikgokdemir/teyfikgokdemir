<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Teyfik Gökdemir TG monogram</title>

  <defs>
    <linearGradient id="tg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d48d"/>
      <stop offset="0.48" stop-color="#dda955"/>
      <stop offset="1" stop-color="#a86b25"/>
    </linearGradient>
  </defs>

  <!-- G -->
  <path
    d="
      M91 35
      C83 22 69 15 53 15
      C29 15 12 34 12 59
      C12 86 30 105 57 105
      C73 105 87 99 98 88
      L98 62
      L70 62
    "
    fill="none"
    stroke="url(#tg-gold)"
    stroke-width="9"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- G horizontal terminal -->
  <path
    d="M70 62H98"
    fill="none"
    stroke="url(#tg-gold)"
    stroke-width="9"
    stroke-linecap="square"
  />

  <!-- T -->
  <path
    d="M31 20H96"
    fill="none"
    stroke="url(#tg-gold)"
    stroke-width="10"
    stroke-linecap="square"
  />

  <path
    d="M63.5 20V91"
    fill="none"
    stroke="url(#tg-gold)"
    stroke-width="9"
    stroke-linecap="square"
  />

  <!-- subtle serif terminals -->
  <path
    d="M51 91H76"
    fill="none"
    stroke="url(#tg-gold)"
    stroke-width="7"
    stroke-linecap="square"
  />
</svg>