name: Automated Maintenance & Health Check

on:
  schedule:
    - cron: '0 3 * * *' # Her gün gece saat 03:00'te çalışır
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Health & SEO Check
        run: |
          echo "Running automated daily health check for the repository..."
          # Buraya projenize özel SEO kontrol, broken link veya build test scriptleri ekleyebilirsiniz.
          npm install || true
          npm run build || true
          echo "Health check completed successfully at $(date)"
