name: Cloudflare Pages Build Verification

on:
  push:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Production deployment is handled by Cloudflare Pages' native GitHub integration.
      # Keeping deployment in this workflow would create duplicate and conflicting deploys.
