name: Production Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed production
        run: node scripts/verify-production.mjs
