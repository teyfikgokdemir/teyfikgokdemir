name: Growth OS CI

on:
  push:
    branches: [growth-os]
    paths:
      - 'growth-os/**'
      - '.github/workflows/growth-os-ci.yml'
  pull_request:
    paths:
      - 'growth-os/**'

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: growth-os/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth-os/apps/api/package.json
      - run: npm install
      - run: npm run build
      - run: node tests/ads-sync-archive.mjs postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: node tests/workspace-activity.mjs postgres://postgres:postgres@127.0.0.1:5432/postgres

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth-os/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth-os/apps/web/package.json
      - run: npm install
      - run: npm run build
