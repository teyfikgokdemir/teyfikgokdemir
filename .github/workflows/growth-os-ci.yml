name: Growth OS CI

on:
  push:
    branches: [growth-os]
    paths:
      - 'growth-os/**'
      - '.github/dependabot.yml'
      - '.github/workflows/growth-os-ci.yml'
  pull_request:
    paths:
      - 'growth-os/**'
      - '.github/dependabot.yml'
      - '.github/workflows/growth-os-ci.yml'
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: growth-os/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth-os/apps/api/package.json
      - run: npm install
      - run: npm run build
      - name: Guard Google Merchant pagination
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/google.ts', 'utf8');
          for (const helper of ['merchantAccountPages','merchantProductsPages','merchantIssuePages']) {
            assert.match(source, new RegExp(`async function ${helper}\\([\\s\\S]*pageToken[\\s\\S]*page<maxPages`), `${helper} must keep bounded pageToken pagination.`);
          }
          assert.match(source, /\['merchant',\(\)=>merchantAccountPages\(/, 'Merchant discovery must use paginated accounts.');
          assert.match(source, /partialAccounts:Boolean\(accountsResponse\.nextPageToken\)/, 'Account truncation must be surfaced.');
          assert.match(source, /partialProducts:Boolean\(productsResponse\.nextPageToken\)/, 'Product truncation must be surfaced.');
          assert.match(source, /partialIssues:Boolean\(issuesResponse\.nextPageToken\)/, 'Issue truncation must be surfaced.');
          NODE
      - run: node tests/ads-pagination.mjs
      - run: node tests/ads-sync-archive.mjs postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: node tests/workspace-activity.mjs postgres://postgres:postgres@127.0.0.1:5432/postgres

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth-os/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth-os/apps/web/package.json
      - run: npm install
      - run: npm run build
      - name: Guard Growth API proxy bounds
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/app/api/growth/[...path]/route.ts', 'utf8');
          assert.match(source, /const PROXY_TIMEOUT_MS = 30_000;/, 'Proxy timeout must remain bounded.');
          assert.match(source, /const PROXY_REQUEST_MAX_BYTES = 1024 \* 1024;/, 'Proxy request bodies must remain bounded.');
          assert.match(source, /const PROXY_RESPONSE_MAX_BYTES = 8 \* 1024 \* 1024;/, 'Proxy responses must remain bounded.');
          assert.match(source, /readLimitedRequestText\(request\)/, 'Proxy must use the bounded request reader.');
          assert.match(source, /readLimitedResponseText\(upstream\)/, 'Proxy must use the bounded response reader.');
          assert.match(source, /status: 413/, 'Oversized proxy requests must fail closed.');
          assert.match(source, /signal: controller\.signal/, 'Proxy upstream fetches must keep the abort signal.');
          NODE
