name: Growth OS CI

on:
  push:
    branches: [growth-os]
    paths:
      - 'growth-os/**'
      - '.github/dependabot.yml'
      - '.github/workflows/growth-os-ci.yml'
  pull_request:
    paths:
      - 'growth-os/**'
      - '.github/dependabot.yml'
      - '.github/workflows/growth-os-ci.yml'
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: growth-os/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth-os/apps/api/package.json
      - run: npm install
      - run: npm run build
      - name: Guard API Docker build context
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const lines = readFileSync('.dockerignore', 'utf8').split(/\r?\n/).map((line) => line.trim());
          for (const required of ['node_modules', '.env', '.env.*', '!.env.example', 'dist']) {
            assert.ok(lines.includes(required), `API .dockerignore must keep ${required} excluded.`);
          }
          NODE
      - name: Guard ads write dual gate
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/execution-policy.ts', 'utf8');
          assert.match(source, /EXTERNAL_EXECUTION_ENABLED[^\n]*&&[^\n]*ADS_WRITE_ENABLED/, 'External ad writes must require both global write gates.');
          assert.match(source, /if\(!policy\.globalWriteEnabled\)throw new Error/, 'Execution must fail closed when the global write gate is disabled.');
          assert.match(source, /if\(!policy\.projectWriteEnabled\)throw new Error/, 'Execution must also require the project write gate.');
          assert.match(source, /if\(policy\.requireManualApproval&&!approved\)throw new Error/, 'Manual approval enforcement must remain in the execution policy.');
          NODE
      - name: Guard Google Merchant pagination
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/google.ts', 'utf8');
          for (const helper of ['merchantAccountPages','merchantProductsPages','merchantIssuePages']) {
            const body = source.slice(source.indexOf(`async function ${helper}(`)).split('\n}')[0];
            assert.match(body, /new Set<string>\(\)/, 'Merchant helper must track seen tokens.');
            assert.match(body, /seenPageTokens\.has\(nextPageToken\)\)throw new Error/, 'Merchant helper must reject repeated tokens.');
            assert.match(body, /seenPageTokens\.add\(nextPageToken\)/, 'Merchant helper must remember tokens.');
            assert.match(source, new RegExp(`async function ${helper}\\([\\s\\S]*pageToken[\\s\\S]*page<maxPages`), `${helper} must keep bounded pageToken pagination.`);
          }
          assert.match(source, /\['merchant',\(\)=>merchantAccountPages\(/, 'Merchant discovery must use paginated accounts.');
          assert.match(source, /partialAccounts:Boolean\(accountsResponse\.nextPageToken\)/, 'Account truncation must be surfaced.');
          assert.match(source, /partialProducts:Boolean\(productsResponse\.nextPageToken\)/, 'Product truncation must be surfaced.');
          assert.match(source, /partialIssues:Boolean\(issuesResponse\.nextPageToken\)/, 'Issue truncation must be surfaced.');
          NODE
      - name: Guard Google Analytics pagination
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/google-analytics.ts', 'utf8');
          assert.match(source, /type AnalyticsSummary=\{[\s\S]*nextPageToken\?:string/, 'Analytics account summary response must retain nextPageToken.');
          assert.match(source, /const ANALYTICS_ACCOUNT_SUMMARY_MAX_PAGES=100;/, 'Analytics pagination must keep a hard page bound.');
          assert.match(source, /async function listProperties\([\s\S]*for\(let page=0;page<ANALYTICS_ACCOUNT_SUMMARY_MAX_PAGES;page\+\+\)[\s\S]*pageSize','200'[\s\S]*pageToken[\s\S]*seenPageTokens/, 'Analytics property discovery must keep bounded paginated account summaries with loop protection.');
          assert.match(source, /summaries\.nextPageToken/, 'Analytics pagination must advance using the API nextPageToken.');
          assert.match(source, /pagination güvenlik sayfa limitini aştı/, 'Analytics pagination must fail closed when the hard page bound is exhausted.');
          NODE
      - name: Guard Meta ad account pagination
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/meta.ts', 'utf8');
          assert.match(source, /const META_MAX_PAGES = 100;/, 'Meta pagination must keep a hard page bound.');
          assert.match(source, /async function getPagedCollection\([\s\S]*paging\?\.cursors\?\.after[\s\S]*seenAfter/, 'Meta pagination must follow and de-duplicate after cursors.');
          assert.match(source, /getPagedCollection\(`\/me\/adaccounts\?fields=/, 'Meta ad account discovery must use paginated collection fetches.');
          NODE
      - name: Guard Cloudflare JWKS rotation handling
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/cloudflare-access.ts', 'utf8');
          assert.match(source, /const CF_ACCESS_JWKS_REFRESH_COOLDOWN_MS=30_000;/, 'JWKS forced refresh must remain rate limited.');
          assert.match(source, /loadJwks\(teamDomain,true\)/, 'Unknown Cloudflare key IDs must trigger one forced JWKS refresh.');
          assert.match(source, /lastForcedJwksRefreshAt/, 'JWKS forced refresh cooldown state must be preserved.');
          NODE
      - run: node tests/audit-comparison.mjs
      - run: node tests/ads-pagination.mjs
      - run: node tests/ads-sync-archive.mjs postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: node tests/workspace-activity.mjs postgres://postgres:postgres@127.0.0.1:5432/postgres

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth-os/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: growth-os/apps/web/package.json
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Guard web Docker build context
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const lines = readFileSync('.dockerignore', 'utf8').split(/\r?\n/).map((line) => line.trim());
          for (const required of ['node_modules', '.next', '.env', '.env.*', '!.env.example']) {
            assert.ok(lines.includes(required), `Web .dockerignore must keep ${required} excluded.`);
          }
          NODE
      - name: Guard Growth API proxy bounds
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const source = readFileSync('src/app/api/growth/[...path]/route.ts', 'utf8');
          assert.match(source, /const PROXY_TIMEOUT_MS = 30_000;/, 'Proxy timeout must remain bounded.');
          assert.match(source, /const PROXY_REQUEST_MAX_BYTES = 1024 \* 1024;/, 'Proxy request bodies must remain bounded.');
          assert.match(source, /const PROXY_RESPONSE_MAX_BYTES = 8 \* 1024 \* 1024;/, 'Proxy responses must remain bounded.');
          assert.match(source, /readLimitedRequestText\(request\)/, 'Proxy must use the bounded request reader.');
          assert.match(source, /readLimitedResponseText\(upstream\)/, 'Proxy must use the bounded response reader.');
          assert.match(source, /status: 413/, 'Oversized proxy requests must fail closed.');
          assert.match(source, /signal: controller\.signal/, 'Proxy upstream fetches must keep the abort signal.');
          NODE
