name: One-time Dependency Security Refresh

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dependency-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh vulnerable dependency resolutions
        run: npm audit fix --package-lock-only

      - name: Verify refreshed dependency graph
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix vulnerable dependency resolutions'
          git push origin HEAD:main
